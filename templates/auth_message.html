{% extends "base.html" %}

{% block title %}EVEase{% endblock %}

{% block content %}

<div class="auth-popup-overlay">
    <div class="auth-popup">

        <button
            type="button"
            class="auth-popup-close"
            onclick="closeAuthPopup()"
            aria-label="Close"
        >
            ×
        </button>

        <div class="auth-popup-icon">
            ✓
        </div>

        <span class="auth-popup-eyebrow">
            EVEASE
        </span>

        <h2>{{ title }}</h2>

        <p class="auth-popup-message">
            {{ message }}
        </p>

        {% if name %}
        <p class="auth-popup-user">
            Welcome back, <strong>{{ name }}</strong>!
        </p>
        {% endif %}

        {% if email %}
        <div class="auth-popup-email">
            <span>Account Email</span>
            <strong>{{ email }}</strong>
        </div>
        {% endif %}

        <a
            href="{{ button_url }}"
            class="btn btn-evease auth-popup-btn"
        >
            {{ button_text }}
            <span>→</span>
        </a>

    </div>
</div>

<script>
    function closeAuthPopup() {
        window.history.back();
    }
</script>

{% endblock %}
