<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EVEase{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- EVEase Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
    >
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg evease-navbar">
        <div class="container">

            <a class="navbar-brand evease-logo" href="/">
                ⚡ EVEase
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-evease-outline" href="#">
                            Login
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Main Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="evease-footer">
        <div class="container text-center">
            <p class="mb-1">
                ⚡ <strong>EVEase</strong>
            </p>

            <p class="mb-0">
                Service at your Doorstep. Peace of Mind in your Hands.
            </p>

            <small>
                © 2026 EVEase. All rights reserved.
            </small>
        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
